<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Home - Welcome to my page!!!</title>
  </head>
  <body>
    <div class="outerbox">
      <div class="info-container">
        <!-- First Row (Spans all 4 columns) -->
        <div class="status-bar">
          SYSTEM STATUS: <span style="color: #39ff14">ONLINE</span>
        </div>

        <!-- Second Row (First Column) -->
        <img
          src="assets/spidey_logo.png"
          alt="spidey_logo"
          loading="lazy"
          class="logo-img-cls"
        />

        <!-- Second Row (Columns 2 to 4) -->
        <div class="info-sec">
          <h1 class="retro-arcade-text" data-text="Biswajit Shaw">
            Biswajit Shaw
          </h1>
          <p>
            Bit by a radioactive spider now survives on web development and
            caffeine.
          </p>
        </div>

        <!-- Third Row (Spans all 4 columns) -->
        <div class="stack-sec">
          <p>Tech Stack: Next.js | Node.js | Docker | Kafka</p>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
